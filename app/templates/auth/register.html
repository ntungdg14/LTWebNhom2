{% extends "layouts/base_store.html" %}
{% block title %}Đăng ký - FREESION{% endblock %}

{% block content %}
<div class="page-narrow">
    <header class="auth-header">
        <h1>Đăng ký tài khoản</h1>
        <p>Tạo tài khoản để trải nghiệm dịch vụ tốt nhất</p>
    </header>
    <form class="form-stack mt-8" action="{{ url_for('login') }}" method="get">
        <div class="field"><label for="full-name">Họ và tên</label><input id="full-name" class="input" type="text" placeholder="Nhập họ và tên" required></div>
        <div class="field"><label for="email">Email</label><input id="email" class="input" type="email" placeholder="Nhập email của bạn" required></div>
        <div class="field"><label for="password">Mật khẩu</label><input id="password" class="input" type="password" placeholder="Nhập mật khẩu" required></div>
        <div class="field"><label for="password-confirmation">Xác nhận mật khẩu</label><input id="password-confirmation" class="input" type="password" placeholder="Nhập lại mật khẩu" required></div>
        <label class="remember"><input type="checkbox"> <span>Đồng ý với các <a href="{{ url_for('home') }}" class="link-underline">điều khoản dịch vụ</a> và <a href="{{ url_for('home') }}" class="link-underline">chính sách bảo mật</a></span></label>
        <button type="submit" class="btn btn-block">Đăng ký</button>
    </form>
    <p class="auth-switch mt-4">Đã có tài khoản? <a href="{{ url_for('login') }}" class="link-underline">Đăng nhập ngay</a></p>
</div>
{% endblock %}
