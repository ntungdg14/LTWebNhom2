{% extends "layouts/base_auth.html" %}
{% block title %}Khôi phục mật khẩu - FREESION{% endblock %}

{% block styles %}
{{ super() }}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/auth/forgot_password.css') }}">
{% endblock %}

{% block content %}
<div class="page-narrow forgot-password">
    <header class="auth-header">
        <h1>Khôi phục mật khẩu</h1>
        <p>Nhập email của bạn để nhận hướng dẫn đặt lại mật khẩu</p>
    </header>
    <form class="form-stack mt-8" action="{{ url_for('auth.login') }}" method="get">
        <div class="field">
            <label for="email">Email</label>
            <input id="email" class="input" type="email" placeholder="Nhập email của bạn" required>
        </div>
        <button type="submit" class="btn btn-block">Gửi yêu cầu</button>
    </form>
    <p class="auth-switch mt-4"><a href="{{ url_for('auth.login') }}" class="link-underline">Quay lại đăng nhập</a></p>
</div>
{% endblock %}
