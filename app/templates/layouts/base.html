<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FREESION - Tự do diện, hiện cá tính{% endblock %}</title>

    {# Lớp CSS nền tảng dùng cho mọi trang. Layout con và trang con bổ sung
       stylesheet của riêng mình thông qua block "styles" (nhớ gọi super()). #}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/commerce.css') }}">
    {% block styles %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
