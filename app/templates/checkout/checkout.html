{% extends "layouts/base_store.html" %}
{% block title %}Thanh toán - FREESION{% endblock %}

{% block styles %}
{{ super() }}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/checkout/steps.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/checkout/checkout.css') }}">
{% endblock %}

{% block content %}
{% set active_step = 3 %}
{% include "layouts/partials/_checkout_steps.html" %}
<div class="page page-narrow">
    <h1 class="page-title">Thanh toán</h1>
    <p id="checkout-status" role="alert"></p>
    <p id="checkout-summary"></p>
    <form id="payment-form" class="form-stack mt-8">
        <label>Phương thức thanh toán
            <select class="input" name="payment_method"><option value="cod">Thanh toán khi nhận hàng (COD)</option><option value="vnpay">VNPAY</option><option value="momo">MoMo</option><option value="card">Thẻ quốc tế</option></select>
        </label>
        <label><input type="checkbox" name="accept_terms" required> Tôi đồng ý với điều khoản mua hàng</label>
        <button class="btn" type="submit">Đặt hàng</button>
        <a href="{{ url_for('checkout.shipping') }}">← Chỉnh sửa địa chỉ</a>
    </form>
</div>
{% endblock %}
